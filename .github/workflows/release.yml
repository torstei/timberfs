name: Release

# Tag-driven releases: push a tag `vX.Y.Z` (matching the Cargo.toml
# version) and this builds the .deb, attests its build provenance, creates
# the GitHub release with generated notes, and publishes to crates.io.
#
# It does NOT re-run the VM suite: it REQUIRES CI to have passed on the
# exact commit instead (see the gate below). So a tag pushed before CI
# finishes fails — and since a squash merge makes a new sha, the wait is
# for MAIN's run, not the pull request's.
#
# crates.io publishing uses Trusted Publishing (OIDC) — no stored secret.
# One-time setup on crates.io: the timberfs crate -> Settings -> Trusted
# Publishing -> GitHub, repository torstei/timberfs, workflow release.yml.
# Until that's configured, the publish step skips with a note.
#
# The .deb is attached twice: with its versioned name, and as the stable
# `timberfs_amd64.deb` so
#   curl -LO https://github.com/torstei/timberfs/releases/latest/download/timberfs_amd64.deb
# always fetches the newest release. Verify a download with:
#   gh attestation verify timberfs_amd64.deb --repo torstei/timberfs

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        # ⚠ Depth 0: the stamp is `git describe`, which needs the tags and
        # the history to count from. The default shallow checkout has
        # neither, and describe would fail rather than mis-stamp — loudly,
        # but at release time.
        with:
          fetch-depth: 0

      # The manifest holds a placeholder; the tag is the version. Stamping
      # here is what makes only a CI run able to mint a release: a local
      # build has no tag to describe.
      - name: Stamp the version from the tag
        run: |
          scripts/stamp-version.sh
          TAG="${GITHUB_REF_NAME#v}"
          VER=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "$TAG" != "$VER" ]; then
            # Describe answered something other than the tag being built —
            # a shallow clone, a tag it cannot see, the wrong lineage.
            # Refuse rather than publish that number.
            echo "::error::stamped ${VER} from the ref, but the tag is ${TAG}"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
      # RESTORE only. Saving runs a cleaning pass over `target/`, looking
      # for the trybuild leftovers a test suite leaves behind — and by then
      # `cargo publish` has made `target/package/timberfs-X.Y.Z/`, which it
      # descends into and cannot find them in. That is four `##[error]`
      # annotations on an otherwise green release, which is how you teach
      # somebody to ignore errors on a release. Nothing wants this cache
      # anyway: CI saved one for the same target minutes ago, and a tag
      # builds once.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb,cargo-zigbuild

      - name: Install zig (cargo-zigbuild's cross linker)
        # Extract OUTSIDE the checkout: unpacking into the repo leaves thousands
        # of untracked files. The publish below passes --allow-dirty for the
        # version stamp, and that must stay a licence for one known change,
        # not cover for a working tree nobody looked at.
        run: |
          curl -fL --retry 3 \
            https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz \
            | tar -xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-linux-x86_64-0.13.0" >> "$GITHUB_PATH"

      # One amd64 package for every supported release. cargo-zigbuild links an
      # old glibc (target .2.31) so it installs from Ubuntu 20.04 (focal) up;
      # the `compat` variant states the true libc6 floor (see Cargo.toml).
      - name: Build the .deb
        run: |
          cargo zigbuild --release --target x86_64-unknown-linux-gnu.2.31
          cargo deb --variant compat --no-build --target x86_64-unknown-linux-gnu

      # CI already passed the VM suite for this commit's TREE, on BOTH
      # images, after building the compat .deb with the identical commands
      # above. (For the tree and not the commit: an identical tree is an
      # identical checkout, and CI short-circuits a re-run on one — see
      # `vm-seen` in ci.yml.) Re-running it here repeated a SUBSET of that —
      # one image — for nine minutes; and "the exact artifact" was never
      # literally the bytes CI tested either, since a Rust build is not
      # bit-reproducible.
      #
      # ⚠ A commit CI never ran on FAILS here. That is the whole gate, and
      # why it requires a `success` rather than the absence of a failure: a
      # tag pushed before CI finished has no runs at all.
      - name: Require CI to have passed on this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          echo "gating on $sha"
          for ctx in checks vm-tests; do
            # join(" ") and not @tsv: the match below is space-delimited, so a
            # tab would hide a SECOND run's conclusion, and a check that failed
            # and was re-run green would read as failed.
            got=$(gh api "repos/${GITHUB_REPOSITORY}/commits/$sha/check-runs" \
                    --paginate \
                    --jq "[.check_runs[] | select(.name == \"$ctx\") | .conclusion] | join(\" \")")
            echo "  $ctx: ${got:-<no run>}"
            case " $got " in
              *" success "*) ;;
              *)
                echo "::error::$ctx has no successful run for $sha. Push the" \
                     "commit, let CI finish, then tag it."
                exit 1
                ;;
            esac
          done

      # Assets are staged OUTSIDE the checkout, the same rule as the zig
      # unpack above: --allow-dirty is a licence for the version stamp and
      # nothing else, so nothing else may dirty the tree.
      - name: Stage release assets
        run: |
          mkdir -p "$RUNNER_TEMP/dist"
          cp target/x86_64-unknown-linux-gnu/debian/timberfs_*_amd64.deb "$RUNNER_TEMP/dist/"
          cp target/x86_64-unknown-linux-gnu/debian/timberfs_*_amd64.deb "$RUNNER_TEMP/dist/timberfs_amd64.deb"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ runner.temp }}/dist/*

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP"/dist/* --generate-notes --verify-tag

      - name: Get a crates.io token via Trusted Publishing (OIDC)
        id: crates_auth
        continue-on-error: true
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish to crates.io (skipped when Trusted Publishing is not configured)
        if: steps.crates_auth.outcome == 'success'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates_auth.outputs.token }}
        # --allow-dirty: the dirt IS the stamp. The tree differs from the
        # tag by exactly the version this release is named after, which is
        # the one difference a publish is entitled to.
        run: cargo publish --allow-dirty

  # Rebuild and redeploy the apt repository on GitHub Pages with the new
  # release included. (A separate `on: release` workflow would never fire:
  # events created with the workflow's own GITHUB_TOKEN don't trigger
  # other workflows.)
  apt-repo:
    needs: release
    uses: ./.github/workflows/apt-repo.yml
    permissions:
      contents: read
      pages: write
      id-token: write
    secrets: inherit
