name: apt-repo

# Rebuilds the apt repository at https://torstei.github.io/timberfs from
# scratch and deploys it to GitHub Pages. The repo is a pure function of
# the GitHub releases: every released versioned .deb goes into the pool
# (`timberfs` and `timberfs-sh` alike),
# apt-ftparchive generates the metadata, and the Release file is signed
# with the key in the APT_SIGNING_KEY secret (public half:
# packaging/apt/timberfs-archive-keyring.gpg, served as /key.gpg).
#
# Runs after every release (called from release.yml) and on manual
# dispatch (e.g. to rebuild after deleting a release).
#
# ⚠ It ends by checking that the site SERVES the pool it just built. A
# successful deployment is not the same fact, and the difference is not
# theoretical — see the comment on that step.

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4

      - name: Download every released versioned .deb
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p site/pool/main
          for tag in $(gh release list --json tagName -q '.[].tagName'); do
            # Both packages, named explicitly, and their names differ in
            # more than the suffix: `timberfs` is versioned `X.Y.Z-1` and
            # built `_amd64`, while `timberfs-sh` is `X.Y.Z` and `_all` —
            # it is a script, and it releases on its own tag. A glob
            # written for one silently omits the other, and the omission
            # looks exactly like a package that was never released.
            gh release download "$tag" \
              --pattern 'timberfs_*-*_amd64.deb' \
              --pattern 'timberfs-sh_*_all.deb' \
              --dir site/pool/main || true
          done
          ls -l site/pool/main

      - name: Import the signing key
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: echo "$APT_SIGNING_KEY" | gpg --batch --import

      - name: Generate and sign the repository metadata
        run: |
          cd site
          mkdir -p dists/stable/main/binary-amd64
          # No --arch filter: the pool holds only what this repository
          # released, and `timberfs-sh` is `Architecture: all`. Whether an
          # arch filter admits `all` is exactly the kind of thing that
          # would drop a package silently, so there is nothing to admit.
          apt-ftparchive packages pool \
            > dists/stable/main/binary-amd64/Packages
          gzip -k -9 dists/stable/main/binary-amd64/Packages
          apt-ftparchive \
            -o APT::FTPArchive::Release::Origin=timberfs \
            -o APT::FTPArchive::Release::Label=timberfs \
            -o APT::FTPArchive::Release::Suite=stable \
            -o APT::FTPArchive::Release::Codename=stable \
            -o APT::FTPArchive::Release::Architectures=amd64 \
            -o APT::FTPArchive::Release::Components=main \
            release dists/stable > Release.tmp
          mv Release.tmp dists/stable/Release
          gpg --batch --yes --clearsign -o dists/stable/InRelease dists/stable/Release
          gpg --batch --yes -abs -o dists/stable/Release.gpg dists/stable/Release

      - name: Add the public key and landing page
        run: |
          cp packaging/apt/timberfs-archive-keyring.gpg site/key.gpg
          cp packaging/apt/index.html site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - uses: actions/deploy-pages@v4
        id: deploy

      # ⚠ A deployment that reports success is not a site that serves it.
      #
      # On 2026-08-30 two releases minutes apart each deployed Pages: the
      # first published a pool built before the second's release existed,
      # the second deployed two minutes later and reported success — and
      # the FIRST one's bytes stayed live. `timberfs 0.27.0` was on the
      # GitHub release and on crates.io while `apt install timberfs` still
      # got 0.26.0, and nothing anywhere was red. A re-dispatch fixed it in
      # eleven seconds, so the deploy was never slow; it simply did not
      # take.
      #
      # So the pool this run BUILT is compared against the index the site
      # SERVES. Nothing is inferred from a version number or a tag: the
      # question is whether these bytes are the ones being served, which is
      # the only thing a release cares about.
      - name: The published index must be the pool this run built
        run: |
          base="${{ steps.deploy.outputs.page_url }}"
          want=$(ls site/pool/main | sort)
          echo "$want" | sed 's/^/  built: /'
          for i in $(seq 1 18); do
            got=$(curl -sfL --max-time 20 \
                    "${base%/}/dists/stable/main/binary-amd64/Packages" \
                  | sed -n 's|^Filename: .*/||p' | sort) || got=""
            if [ "$want" = "$got" ]; then
              echo "the published index is this run's pool (after $((i * 10 - 10))s)"
              exit 0
            fi
            sleep 10
          done
          echo "::error::the site serves an index that is not the pool this run built"
          diff <(echo "$want") <(echo "$got") | sed 's/^/  /' || true
          exit 1
