name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --release

  # The clients' own suites — seconds, and they need no VM, no timberfs and
  # no network: `--cmd` points at a fake that answers from a script. Local
  # `scripts/check.sh` runs them, which leaves them ungated on a push that
  # skipped the hook.
  clients:
    name: clients
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 -m py_compile tools/timbersh tools/timberview.py \
            tools/timberview tools/timberfs_client.py
      - run: tests/timberfs-client/test-timberfs-client
      - run: tests/timbersh/test-timbersh
      - run: tests/timberview/test-timberview

  # Has this exact TREE already passed the VM suite?
  #
  # A squash merge makes a new sha for a tree that was tested minutes ago on
  # the pull request, so main re-ran eighteen minutes of VM for a byte-
  # identical checkout. The key is the tree and not the branch, the PR or the
  # sha: an identical tree has identical inputs, and the workflow files are
  # IN the tree, so changing CI invalidates its own short-circuit.
  #
  # ⚠ A cache would be the obvious mechanism and cannot work: an Actions cache
  # written on a feature branch is not visible to a run on main, which is
  # exactly the direction needed. An artifact is visible across branches
  # through the API, so the marker is one.
  vm-seen:
    name: vm-seen
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tree: ${{ steps.probe.outputs.tree }}
      hit: ${{ steps.probe.outputs.hit }}
    steps:
      - uses: actions/checkout@v4
      - id: probe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tree=$(git rev-parse HEAD^{tree})
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          n=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=vm-pass-$tree" \
                --jq '[.artifacts[] | select(.expired | not)] | length')
          echo "tree $tree: ${n:-0} prior pass(es)"
          if [ "${n:-0}" -gt 0 ]; then echo "hit=yes" >> "$GITHUB_OUTPUT"
          else echo "hit=no" >> "$GITHUB_OUTPUT"; fi

  vm-tests-matrix:
    name: vm-tests (${{ matrix.image }})
    needs: vm-seen
    if: needs.vm-seen.outputs.hit != 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # We ship one old-glibc .deb for every supported release, so test it on
        # the OLDEST we claim (focal — Ubuntu 20.04, systemd 245, glibc 2.31)
        # and a current one (trixie). `timberfs-bionic` is a second package for
        # one release below that floor, so it gets its own leg on its own image.
        #
        # The glibc target, the cargo-deb variant and the package name travel
        # WITH the image rather than being derived from it: both zigbuild
        # targets write the same `target/x86_64-unknown-linux-gnu/release/`
        # (cargo-zigbuild strips the glibc suffix), so a leg that built the
        # wrong pair would package a binary its declared libc6 floor does not
        # match — and only running it on the older image says so.
        include:
          - { image: trixie, glibc: "2.31", variant: compat, pkg: timberfs }
          - { image: focal,  glibc: "2.31", variant: compat, pkg: timberfs }
          - { image: bionic, glibc: "2.27", variant: bionic, pkg: timberfs-bionic }
    steps:
      - uses: actions/checkout@v4
        # Depth 0: the build stamps from `git describe`.
        with:
          fetch-depth: 0
      # /dev/kvm exists on GitHub's standard runners but isn't accessible
      # to the runner user by default
      - name: Enable KVM for the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install QEMU and ISO tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils genisoimage
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Cache cloud base image
        uses: actions/cache@v4
        with:
          path: ~/.cache/timberfs-vm-tests
          key: vm-base-${{ matrix.image }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb,cargo-zigbuild
      - name: Install zig (cargo-zigbuild's cross linker)
        # Extract OUTSIDE the checkout so the working tree stays clean.
        run: |
          curl -fL --retry 3 \
            https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz \
            | tar -xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-linux-x86_64-0.13.0" >> "$GITHUB_PATH"
      # Build and test exactly what we ship: the old-glibc compat .deb.
      #
      # Stamped like a release is — on main that is the NEXT version, so
      # what the suite tests here is what tagging this commit would
      # publish, rather than a placeholder or a version it is not.
      - name: Build the .deb this leg tests
        run: |
          scripts/stamp-version.sh
          cargo zigbuild --release --target x86_64-unknown-linux-gnu.${{ matrix.glibc }}
          cargo deb --variant ${{ matrix.variant }} --no-build --target x86_64-unknown-linux-gnu
      - name: Run the VM package test suite
        env:
          TIMBERFS_VM_IMAGE: ${{ matrix.image }}
        run: tests/vm/run-vm-test.sh target/x86_64-unknown-linux-gnu/debian/${{ matrix.pkg }}_*_amd64.deb

  # Single required status check that stays green iff every matrix leg passed.
  # Branch protection requires the context `vm-tests`; the matrix legs report as
  # `vm-tests (trixie)` / `vm-tests (focal)`, so this aggregates them into that
  # one name without pinning the protection rule to specific matrix values.
  vm-tests:
    needs: [vm-seen, vm-tests-matrix]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Gate on the matrix result
        run: |
          if [ "${{ needs.vm-seen.outputs.hit }}" = "yes" ]; then
            echo "tree ${{ needs.vm-seen.outputs.tree }} already passed the VM suite"
            exit 0
          fi
          if [ "${{ needs.vm-tests-matrix.result }}" != "success" ]; then
            echo "a vm-tests matrix leg did not succeed: ${{ needs.vm-tests-matrix.result }}" >&2
            exit 1
          fi
      # Written only where the suite actually RAN and passed, so a hit can
      # never mint a marker from another hit. The file is a receipt, not
      # data: what matters is that an artifact by this name exists.
      - name: Record that this tree passed
        if: needs.vm-seen.outputs.hit != 'yes'
        run: echo "${{ github.sha }}" > vm-pass.txt
      - uses: actions/upload-artifact@v4
        if: needs.vm-seen.outputs.hit != 'yes'
        with:
          name: vm-pass-${{ needs.vm-seen.outputs.tree }}
          path: vm-pass.txt
          retention-days: 90
          if-no-files-found: error
