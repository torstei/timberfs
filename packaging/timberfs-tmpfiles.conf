# Runtime directories for timberfs log-intake FIFOs: timberfs-log@.socket creates
# /run/timberfs/<instance>.pipe, and timberfs-text@.socket (the plain-text pair)
# /run/timberfs/text/<instance>.pipe. Installed as /usr/lib/tmpfiles.d/timberfs.conf
# and applied at boot; for an immediate first use run `systemd-tmpfiles --create`.
d /run/timberfs 0755 root root -
d /run/timberfs/text 0755 root root -
